name: Build Clean Route v1.5.7 Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ agent/v157-work2, agent/clean-route-v1.0.0 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-v157:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Reconstruct v1.5.6 proven baseline then apply v1.5.7
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'

          # Re-use the exact v1.5.6 reconstruction step that already passed Windows CI.
          # This avoids independently re-implementing the older v1.5.1→v1.5.6 patch chain.
          $workflow='.github/workflows/build-clean-route.yml'
          $lines=Get-Content $workflow
          $start=[Array]::IndexOf($lines,'      - name: Reconstruct Clean Route v1.5.6 final sources')
          $next=[Array]::IndexOf($lines,'      - name: Build + scope audit + route self-test')
          if($start -lt 0 -or $next -le $start){throw 'Cannot locate v1.5.6 proven reconstruction step'}
          $runLine=$start+2
          if($lines[$runLine].Trim() -ne 'run: |'){throw 'Unexpected v1.5.6 workflow layout'}
          $body=$lines[($runLine+1)..($next-1)] | ForEach-Object {
            if($_.Length -ge 10){$_.Substring(10)} else {''}
          }
          Invoke-Expression ($body -join [Environment]::NewLine)

          $controllerPath='clean-route/src/controller.cpp'
          $v156=(Get-FileHash -Algorithm SHA256 $controllerPath).Hash.ToLowerInvariant()
          Write-Host "v1.5.6 proven baseline SHA256=$v156"
          if($v156 -ne '840bc0376961d2838e1ca46598c43b07d91ccec846f375efece8f2ae569b6711'){throw 'v1.5.6 baseline mismatch'}

          $patchExe='C:\Program Files\Git\usr\bin\patch.exe'
          Push-Location clean-route
          try {
            Get-Content 'patches/v1.5.7_controller.patch' -Raw | & $patchExe -p1 --forward --batch --fuzz=0
            if($LASTEXITCODE -ne 0){throw 'v1.5.7 controller patch failed'}
          } finally { Pop-Location }

          $v157=(Get-FileHash -Algorithm SHA256 $controllerPath).Hash.ToLowerInvariant()
          Write-Host "v1.5.7 controller final SHA256=$v157"
          if($v157 -ne 'b625e3530be6856022d563d1aaef2a6b359edf8ff15a8fe8710960493f4353e3'){throw 'v1.5.7 final controller mismatch'}

          $controller=[IO.File]::ReadAllText($controllerPath)
          foreach($marker in @('routeOwnershipResetPending','HandleRouteOwnershipReset','SESSION ROUTE RESET','kRouteOwnershipStopMaxAttempts = 3')){
            if(-not $controller.Contains($marker)){throw "Missing v1.5.7 marker $marker"}
          }

          # Build metadata is rewritten only in CI; v1.5.6 source/history remains intact in git.
          $buildPath='clean-route/build.cmd'
          $build=[IO.File]::ReadAllText($buildPath)
          $build=$build.Replace('v1.5.6','v1.5.7').Replace('Death Session Cold Restart','Route Ownership Reacquire')
          [IO.File]::WriteAllText($buildPath,$build,[Text.UTF8Encoding]::new($false))

          $rcPath='clean-route/resources/app.rc'
          $rc=[IO.File]::ReadAllText($rcPath)
          $rc=$rc.Replace('1,5,6,0','1,5,7,0').Replace('1.5.6.0','1.5.7.0').Replace('ThanLongCleanRoute_v1.5.6.exe','ThanLongCleanRoute_v1.5.7.exe')
          [IO.File]::WriteAllText($rcPath,$rc,[Text.UTF8Encoding]::new($false))

      - name: Build + safety audit + route self-test
        shell: pwsh
        working-directory: clean-route
        run: |
          $ErrorActionPreference='Continue'
          & cmd /c build.cmd 2>&1 | Tee-Object -FilePath build-v157.log
          $code=$LASTEXITCODE
          if($code -ne 0){
            $tail=((Get-Content build-v157.log -Tail 120) -join ' | ')
            $tail=$tail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=v1.5.7 build diagnostic::$tail"
            exit $code
          }

      - name: Package v1.5.7
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'clean-route/release-v157' | Out-Null
          $src='clean-route/release-v157/ThanLongCleanRoute_Source_v1.5.7.zip'
          Compress-Archive -Path 'clean-route/src','clean-route/resources','clean-route/docs','clean-route/build.cmd','clean-route/README.md','clean-route/CLEAN_REWRITE_AUDIT.md','clean-route/PROJECT_SUMMARY.md','PROJECT_KNOWLEDGE.md','CHANGELOG.md' -DestinationPath $src -CompressionLevel Optimal
          Copy-Item 'clean-route/dist/ThanLongCleanRoute_v1.5.7.exe' 'clean-route/release-v157/ThanLongCleanRoute_v1.5.7.exe'
          Copy-Item 'clean-route/dist/ThanLongCleanRouteBridge.dll' 'clean-route/release-v157/ThanLongCleanRouteBridge.dll'
          Copy-Item 'clean-route/docs/features/ROUTE_OWNERSHIP_REACQUIRE.md' 'clean-route/release-v157/ROUTE_OWNERSHIP_REACQUIRE.md'
          Copy-Item 'clean-route/docs/history/VERSION_v1.5.7.md' 'clean-route/release-v157/VERSION_v1.5.7.md'
          Copy-Item 'clean-route/docs/bugs/BUG_004_ROUTE_OWNERSHIP.md' 'clean-route/release-v157/BUG_004_ROUTE_OWNERSHIP.md'
          Copy-Item 'clean-route/docs/evidence/EVID_011_ROUTE_OWNERSHIP.md' 'clean-route/release-v157/EVID_011_ROUTE_OWNERSHIP.md'
          Copy-Item 'clean-route/docs/decisions/DECISION_011_ROUTE_OWNERSHIP.md' 'clean-route/release-v157/DECISION_011_ROUTE_OWNERSHIP.md'

      - name: Verify v1.5.7 artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe='clean-route/release-v157/ThanLongCleanRoute_v1.5.7.exe'
          $dll='clean-route/release-v157/ThanLongCleanRouteBridge.dll'
          $src='clean-route/release-v157/ThanLongCleanRoute_Source_v1.5.7.zip'
          foreach($p in @($exe,$dll,$src)){if(!(Test-Path $p)){throw "Missing $p"}}
          $b=[IO.File]::ReadAllBytes($dll)
          if($b[0] -ne 0x4D -or $b[1] -ne 0x5A){throw 'Bridge is not PE/MZ'}
          $pe=[BitConverter]::ToInt32($b,0x3C)
          $ch=[BitConverter]::ToUInt16($b,$pe+22)
          if(($ch -band 0x2000) -eq 0){throw 'Bridge missing DLL characteristic'}
          $h=[System.Runtime.InteropServices.NativeLibrary]::Load((Resolve-Path $dll).Path)
          try {
            $p=[System.Runtime.InteropServices.NativeLibrary]::GetExport($h,'TlcGetMessageHook')
            if($p -eq [IntPtr]::Zero){throw 'Missing TlcGetMessageHook export'}
          } finally { [System.Runtime.InteropServices.NativeLibrary]::Free($h) }
          Write-Host ('EXE SHA256: ' + (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant())
          Write-Host ('DLL SHA256: ' + (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant())
          Write-Host ('SOURCE SHA256: ' + (Get-FileHash -Algorithm SHA256 $src).Hash.ToLowerInvariant())

      - uses: actions/upload-artifact@v4
        with:
          name: ThanLongCleanRoute_v1.5.7_RouteOwnershipReacquire
          path: clean-route/release-v157/*
          if-no-files-found: error
