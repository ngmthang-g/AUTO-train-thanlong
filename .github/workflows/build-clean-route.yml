name: Build Clean Route Windows x64

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ agent/clean-route-v1.0.0 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Reconstruct Clean Route v1.5.6 final sources
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'

          function Restore-Single([string]$sourcePath,[string]$destPath,[string]$sha) {
            $b64=[IO.File]::ReadAllText($sourcePath).Trim()
            $gzBytes=[Convert]::FromBase64String($b64)
            $ms=[IO.MemoryStream]::new($gzBytes)
            $gz=[IO.Compression.GZipStream]::new($ms,[IO.Compression.CompressionMode]::Decompress)
            $out=[IO.File]::Create($destPath)
            $gz.CopyTo($out); $out.Dispose(); $gz.Dispose(); $ms.Dispose()
            $actual=(Get-FileHash -Algorithm SHA256 $destPath).Hash.ToLowerInvariant()
            Write-Host "$destPath transport SHA256=$actual"
            if($actual -ne $sha){throw "$destPath transport hash mismatch"}
          }

          function Restore-Parts([string]$name,[string]$destPath,[string]$sha) {
            $parts=Get-ChildItem "clean-route/transport/$name.gz.b64.*" | Sort-Object Name
            if($parts.Count -lt 1){throw "Missing transport parts for $name"}
            $b64=($parts | ForEach-Object {[IO.File]::ReadAllText($_.FullName).Trim()}) -join ''
            $gzBytes=[Convert]::FromBase64String($b64)
            $ms=[IO.MemoryStream]::new($gzBytes)
            $gz=[IO.Compression.GZipStream]::new($ms,[IO.Compression.CompressionMode]::Decompress)
            $out=[IO.File]::Create($destPath)
            $gz.CopyTo($out); $out.Dispose(); $gz.Dispose(); $ms.Dispose()
            $actual=(Get-FileHash -Algorithm SHA256 $destPath).Hash.ToLowerInvariant()
            Write-Host "$destPath baseline SHA256=$actual"
            if($actual -ne $sha){throw "$destPath baseline hash mismatch"}
          }

          Restore-Single 'clean-route/transport-v152/bridge.cpp.gz.b64' 'clean-route/src/bridge.cpp' 'f96d5bddaa4c9455f7752d3674d94642a72603cb610df7152c1e9d0ef36fe6fd'
          Restore-Parts 'controller.cpp' 'clean-route/src/controller.cpp' '275b10ee8653a3497ad0e7ac2d2e01e6b70763eaff4331ebfc0164a73dd70a6b'

          $controllerPath='clean-route/src/controller.cpp'
          $controller=[IO.File]::ReadAllText($controllerPath)
          foreach($line in @(
            'constexpr DWORD kConfirmFirstDelayMs = 2500;',
            'constexpr DWORD kConfirmRetryMs = 2500;',
            'constexpr DWORD kConfirmFinalWaitMs = 5000;',
            'constexpr int kConfirmMaxAttempts = 3;'
          )) {
            if($controller.Contains($line)){$controller=$controller.Replace($line,'')}
          }
          [IO.File]::WriteAllText($controllerPath,$controller,[Text.UTF8Encoding]::new($false))
          $v151=(Get-FileHash -Algorithm SHA256 $controllerPath).Hash.ToLowerInvariant()
          Write-Host "v1.5.1 normalized controller SHA256=$v151"
          if($v151 -ne '021728f2361148150f14e319ea0d65515e5a816175b07d5f77f74731bd466d9f'){throw 'v1.5.1 normalized baseline mismatch'}

          $patchExe='C:\Program Files\Git\usr\bin\patch.exe'
          if(!(Test-Path $patchExe)){throw 'GNU patch.exe not found'}

          Push-Location clean-route
          try {
            Get-Content 'patches/v1.5.2_controller.patch' -Raw | & $patchExe -p1 --forward --batch --fuzz=3
            if($LASTEXITCODE -ne 0){throw 'v1.5.2 controller patch failed'}
          } finally { Pop-Location }

          $bridgePath='clean-route/src/bridge.cpp'
          $bridge=[IO.File]::ReadAllText($bridgePath)
          $findLine='const MethodInfo* find = ExactMethod(c.guiApi, "FindUI", 1, true, "System.String");'
          $mainFallback='if (!find) find = ExactMethod(c.guiApi, "MainFindUI", 1, true, "System.String");'
          if($bridge.Contains($findLine)){
            $bridge=$bridge.Replace($findLine,'const MethodInfo* find = ExactMethod(c.guiApi, "MainFindUI", 1, true, "System.String");')
          }
          if($bridge.Contains($mainFallback)){
            $bridge=$bridge.Replace($mainFallback,'if (!find) find = ExactMethod(c.guiApi, "FindUI", 1, true, "System.String");')
          }
          if(-not $bridge.Contains('const MethodInfo* find = ExactMethod(c.guiApi, "MainFindUI", 1, true, "System.String");') -or
             -not $bridge.Contains('if (!find) find = ExactMethod(c.guiApi, "FindUI", 1, true, "System.String");')) {
            throw 'Semantic MessageBox detector method priority rewrite failed'
          }
          [IO.File]::WriteAllText($bridgePath,$bridge,[Text.UTF8Encoding]::new($false))

          $controller=[IO.File]::ReadAllText($controllerPath)
          $needle='        if (s.confirmUiVisible) {'
          if($controller.Contains($needle) -and -not $controller.Contains('Confirm UI có nhưng nhân vật chưa đứng yên ổn định')) {
            $guard=@(
              '        if ((s.validMask & ValidMoving) == 0) {',
              '            rt.status = L"Cross-map • moving observer chưa authoritative → chờ";',
              '            return true;',
              '        }',
              '        if (s.moving || rt.lastMovementTick == 0 || !Elapsed(now, rt.lastMovementTick, 1200)) {',
              '            rt.status = L"Confirm UI có nhưng nhân vật chưa đứng yên ổn định";',
              '            return true;',
              '        }',
              ''
            ) -join [Environment]::NewLine
            $controller=$controller.Replace($needle,$guard + [Environment]::NewLine + $needle)
          }
          [IO.File]::WriteAllText($controllerPath,$controller,[Text.UTF8Encoding]::new($false))

          Push-Location clean-route
          try {
            Get-Content 'patches/v1.5.3_controller.patch' -Raw | & $patchExe -p1 --forward --batch --fuzz=3
            if($LASTEXITCODE -ne 0){throw 'v1.5.3 controller patch failed'}
          } finally { Pop-Location }

          $controller=[IO.File]::ReadAllText($controllerPath)
          $oldTitle='constexpr wchar_t kTitle[] = L"Thần Long Clean Route v1.5.2 • Semantic Confirm Detector";'
          $newTitle='constexpr wchar_t kTitle[] = L"Thần Long Clean Route v1.5.3 • Path-ON Semantic Confirm";'
          if($controller.Contains($oldTitle)){$controller=$controller.Replace($oldTitle,$newTitle)}
          if(-not $controller.Contains($newTitle)){throw 'v1.5.3 title/version identity rewrite failed'}
          [IO.File]::WriteAllText($controllerPath,$controller,[Text.UTF8Encoding]::new($false))

          Push-Location clean-route
          try {
            Get-Content 'patches/v1.5.4_controller.patch' -Raw | & $patchExe -p1 --forward --batch --fuzz=3
            if($LASTEXITCODE -ne 0){throw 'v1.5.4 controller patch failed'}
          } finally { Pop-Location }

          $v154Controller=(Get-FileHash -Algorithm SHA256 $controllerPath).Hash.ToLowerInvariant()
          Write-Host "v1.5.4 controller baseline SHA256=$v154Controller"
          if($v154Controller -ne '582c723501234caef039ea00d9ace0be0ef6a86b37874927b1ac5a6da5c98d3b'){throw 'v1.5.4 controller baseline mismatch'}

          Push-Location clean-route
          try {
            Get-Content 'patches/v1.5.5_controller.patch' -Raw | & $patchExe -p1 --forward --batch --fuzz=3
            if($LASTEXITCODE -ne 0){throw 'v1.5.5 controller patch failed'}
          } finally { Pop-Location }

          $v155Controller=(Get-FileHash -Algorithm SHA256 $controllerPath).Hash.ToLowerInvariant()
          Write-Host "v1.5.5 controller baseline SHA256=$v155Controller"
          if($v155Controller -ne '73451f4fbc244c9b05ef3f86ff3daeb445b3e4bffd0be6e534bc514cb0759d8e'){throw 'v1.5.5 controller baseline mismatch'}

          Push-Location clean-route
          try {
            Get-Content 'patches/v1.5.6_controller.patch' -Raw | & $patchExe -p1 --forward --batch --fuzz=0
            if($LASTEXITCODE -ne 0){throw 'v1.5.6 controller patch failed'}
          } finally { Pop-Location }

          $finalController=(Get-FileHash -Algorithm SHA256 $controllerPath).Hash.ToLowerInvariant()
          Write-Host "v1.5.6 controller final SHA256=$finalController"
          if($finalController -ne '840bc0376961d2838e1ca46598c43b07d91ccec846f375efece8f2ae569b6711'){throw 'v1.5.6 final controller hash mismatch'}
          Write-Host ('v1.5.6 bridge final SHA256=' + (Get-FileHash -Algorithm SHA256 $bridgePath).Hash.ToLowerInvariant())

      - name: Build + scope audit + route self-test
        shell: pwsh
        working-directory: clean-route
        run: |
          $ErrorActionPreference='Continue'
          & cmd /c build.cmd 2>&1 | Tee-Object -FilePath build-v156.log
          $code=$LASTEXITCODE
          if($code -ne 0) {
            $tail=((Get-Content build-v156.log -Tail 120) -join ' | ')
            $tail=$tail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=v1.5.6 build diagnostic::$tail"
            exit $code
          }

      - name: Package source and release root
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'clean-route/release' | Out-Null
          $src='clean-route/release/ThanLongCleanRoute_Source_v1.5.6.zip'
          if(Test-Path $src){Remove-Item $src -Force}
          Compress-Archive -Path 'clean-route/src','clean-route/resources','clean-route/docs','clean-route/build.cmd','clean-route/README.md','clean-route/CLEAN_REWRITE_AUDIT.md','clean-route/PROJECT_SUMMARY.md','PROJECT_KNOWLEDGE.md','CHANGELOG.md' -DestinationPath $src -CompressionLevel Optimal
          Copy-Item 'clean-route/dist/ThanLongCleanRoute_v1.5.6.exe' 'clean-route/release/ThanLongCleanRoute_v1.5.6.exe'
          Copy-Item 'clean-route/dist/ThanLongCleanRouteBridge.dll' 'clean-route/release/ThanLongCleanRouteBridge.dll'
          Copy-Item 'clean-route/README.md' 'clean-route/release/README.md'
          Copy-Item 'clean-route/CLEAN_REWRITE_AUDIT.md' 'clean-route/release/CLEAN_REWRITE_AUDIT.md'
          Copy-Item 'clean-route/PROJECT_SUMMARY.md' 'clean-route/release/PROJECT_SUMMARY.md'
          Copy-Item 'PROJECT_KNOWLEDGE.md' 'clean-route/release/PROJECT_KNOWLEDGE.md'
          Copy-Item 'CHANGELOG.md' 'clean-route/release/CHANGELOG.md'
          Copy-Item -Recurse 'clean-route/docs' 'clean-route/release/docs'

      - name: Verify artifacts
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe='clean-route/release/ThanLongCleanRoute_v1.5.6.exe'
          $dll='clean-route/release/ThanLongCleanRouteBridge.dll'
          $src='clean-route/release/ThanLongCleanRoute_Source_v1.5.6.zip'
          $required=@($exe,$dll,$src,'clean-route/release/PROJECT_SUMMARY.md','clean-route/release/PROJECT_KNOWLEDGE.md','clean-route/release/CHANGELOG.md','clean-route/release/docs/DATA_REPO_USAGE.md','clean-route/release/docs/features/CROSS_MAP_CONFIRM.md','clean-route/release/docs/features/UNDERWORLD_RECOVERY.md','clean-route/release/docs/features/DEATH_SESSION_COLD_RESTART.md','clean-route/release/docs/history/VERSION_v1.5.5.md','clean-route/release/docs/history/VERSION_v1.5.6.md')
          foreach($p in $required){if(!(Test-Path $p)){throw "Missing $p"}}
          $b=[IO.File]::ReadAllBytes($dll)
          if($b.Length -lt 256){throw 'Bridge DLL too small'}
          if($b[0] -ne 0x4D -or $b[1] -ne 0x5A){throw 'Bridge is not PE/MZ'}
          $pe=[BitConverter]::ToInt32($b,0x3C)
          if($pe -lt 0 -or $pe+24 -ge $b.Length){throw 'Invalid PE header'}
          if($b[$pe] -ne 0x50 -or $b[$pe+1] -ne 0x45 -or $b[$pe+2] -ne 0 -or $b[$pe+3] -ne 0){throw 'Missing PE signature'}
          $ch=[BitConverter]::ToUInt16($b,$pe+22)
          if(($ch -band 0x2000) -eq 0){throw 'Bridge PE missing DLL characteristic'}
          Write-Host ('BRIDGE FORMAT PASS: MZ/PE, characteristics=0x{0:X4}' -f $ch)
          $full=(Resolve-Path $dll).Path
          $h=[System.Runtime.InteropServices.NativeLibrary]::Load($full)
          if($h -eq [IntPtr]::Zero){throw 'NativeLibrary.Load returned NULL'}
          try {
            $p=[System.Runtime.InteropServices.NativeLibrary]::GetExport($h,'TlcGetMessageHook')
            if($p -eq [IntPtr]::Zero){throw 'Missing TlcGetMessageHook export'}
            Write-Host 'BRIDGE LOADLIBRARY/EXPORT PASS'
          } finally {
            [System.Runtime.InteropServices.NativeLibrary]::Free($h)
          }
          $eh=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          $dh=(Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          $sh=(Get-FileHash -Algorithm SHA256 $src).Hash.ToLowerInvariant()
          Write-Host "EXE SHA256: $eh"
          Write-Host "DLL SHA256: $dh"
          Write-Host "SOURCE SHA256: $sh"
          "exe_sha256=$eh" >> $env:GITHUB_OUTPUT
          "dll_sha256=$dh" >> $env:GITHUB_OUTPUT
          "source_sha256=$sh" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ThanLongCleanRoute_v1.5.6_DeathSessionColdRestart
          path: clean-route/release/*
          if-no-files-found: error
