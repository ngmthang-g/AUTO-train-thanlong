name: Build NewCore Windows x64
on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/hidden-auto-chat-test]
    paths-ignore:
      - 'dist/ThanLongHiddenAutoChat_TEST.exe'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build main NewCore
        shell: cmd
        run: build.cmd
      - name: Build hidden chat test
        shell: cmd
        run: build-chat-test.cmd
      - name: Verify binaries
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $main='dist/ThanLongAutoTrain_NewCore_v1.0.7.exe'
          $dll='dist/ThanLongNewCoreBridge.dll'
          $chat='dist/ThanLongHiddenAutoChat_TEST.exe'
          foreach ($f in @($main,$dll,$chat)) { if (!(Test-Path $f)) { throw "Missing $f" } }
          Get-FileHash -Algorithm SHA256 $main,$dll,$chat | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: ThanLongHiddenAutoChat_TEST
          path: dist/ThanLongHiddenAutoChat_TEST.exe
      - name: Commit standalone chat test EXE
        if: github.ref == 'refs/heads/feature/hidden-auto-chat-test'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/ThanLongHiddenAutoChat_TEST.exe
          if (git diff --cached --quiet) { Write-Host 'EXE unchanged'; exit 0 }
          git commit -m "build: publish hidden auto chat test exe"
          git push
