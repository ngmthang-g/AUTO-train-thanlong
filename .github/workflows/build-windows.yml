name: Build ThanLong Clean Route Windows x64

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build and self-test
        shell: cmd
        run: build.cmd

      - name: Verify artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist/ThanLongCleanRoute_v1.5.10.exe'
          $dll = 'dist/ThanLongCleanRouteBridge.dll'
          if (!(Test-Path $exe)) { throw "Missing $exe" }
          if (!(Test-Path $dll)) { throw "Missing $dll" }
          Get-FileHash -Algorithm SHA256 $exe,$dll | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: ThanLongCleanRoute_v1.5.10
          path: |
            dist/ThanLongCleanRoute_v1.5.10.exe
            dist/ThanLongCleanRouteBridge.dll
          if-no-files-found: error
