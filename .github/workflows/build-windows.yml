name: Build NewCore Windows x64
on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/hidden-auto-chat-test]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build main NewCore
        shell: cmd
        run: build.cmd
      - name: Build hidden chat test
        shell: cmd
        run: build-chat-test.cmd
      - name: Verify main NewCore
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe='dist/ThanLongAutoTrain_NewCore_v1.0.7.exe'
          $dll='dist/ThanLongNewCoreBridge.dll'
          if (!(Test-Path $exe)) { throw 'Missing EXE' }
          if (!(Test-Path $dll)) { throw 'Missing bridge DLL' }
          Get-FileHash -Algorithm SHA256 $exe,$dll | Format-Table -AutoSize
      - name: Verify chat test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $chat='dist/ThanLongHiddenAutoChat_TEST.exe'
          if (!(Test-Path $chat)) { throw 'Missing chat test EXE' }
          Get-FileHash -Algorithm SHA256 $chat | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: ThanLongAutoTrain_NewCore_v1.0.7
          path: |
            dist/ThanLongAutoTrain_NewCore_v1.0.7.exe
            dist/ThanLongNewCoreBridge.dll
      - uses: actions/upload-artifact@v4
        with:
          name: ThanLongHiddenAutoChat_TEST
          path: dist/ThanLongHiddenAutoChat_TEST.exe
