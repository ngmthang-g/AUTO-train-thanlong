name: Build NewCore Windows x64
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build
        shell: cmd
        run: build.cmd
      - name: Verify
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe='dist/ThanLongAutoTrain_NewCore_v1.0.8.exe'
          $dll='dist/ThanLongNewCoreBridge.dll'
          if (!(Test-Path $exe)) { throw 'Missing EXE' }
          if (!(Test-Path $dll)) { throw 'Missing bridge DLL' }
          Get-FileHash -Algorithm SHA256 $exe,$dll | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: ThanLongAutoTrain_NewCore_v1.0.8
          path: |
            dist/ThanLongAutoTrain_NewCore_v1.0.8.exe
            dist/ThanLongNewCoreBridge.dll
