name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "src/**"
      - "resources/**"
      - "build.cmd"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "src/**"
      - "resources/**"
      - "build.cmd"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 / Zig 0.15.2
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download Zig 0.15.2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zigVersion = '0.15.2'
          $zip = Join-Path $env:RUNNER_TEMP "zig-$zigVersion.zip"
          $dir = Join-Path $env:RUNNER_TEMP "zig-$zigVersion"
          Invoke-WebRequest -Uri "https://ziglang.org/download/$zigVersion/zig-x86_64-windows-$zigVersion.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $zigHome = Join-Path $dir "zig-x86_64-windows-$zigVersion"
          if (-not (Test-Path (Join-Path $zigHome 'zig.exe'))) {
            throw "zig.exe was not found after extracting Zig $zigVersion"
          }
          $zigHome | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Zig
        shell: cmd
        run: zig version

      - name: Build release EXE
        shell: cmd
        run: call build.cmd

      - name: Verify output
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist/ThanLongAutoTrain_v0.7.0.exe'
          if (-not (Test-Path $exe)) { throw "Build completed without expected output: $exe" }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ThanLongAutoTrain-v0.7.0-windows-x64
          path: dist/ThanLongAutoTrain_v0.7.0.exe
          if-no-files-found: error
          retention-days: 30
