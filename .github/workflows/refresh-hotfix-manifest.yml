name: Refresh hotfix source manifest

on:
  push:
    branches:
      - agent/v1.5.10-internal-ui-v087

permissions:
  contents: read

jobs:
  manifest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recompute canonical Git-blob manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $manifest = 'SOURCE_MANIFEST_v1.5.10.sha256'
          $paths = @()
          foreach ($line in Get-Content $manifest -Encoding UTF8) {
            if ($line -match '^[0-9a-fA-F]{64}  \./(.+)$') { $paths += $Matches[1] }
          }
          $bug = 'docs/bugs/BUG_006_STARTUP_SCAN_BRIDGE_DISS.md'
          if ($paths -notcontains $bug) { $paths += $bug }

          $zipPath = Join-Path $env:RUNNER_TEMP 'canonical-source.zip'
          git archive --format=zip --output=$zipPath HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          $zip = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $sha = [Security.Cryptography.SHA256]::Create()
            try {
              $out = foreach ($p in $paths) {
                $normalized = $p -replace '\\','/'
                $entry = $zip.GetEntry($normalized)
                if ($null -eq $entry) { throw "Manifest path missing in Git archive: $normalized" }
                $stream = $entry.Open()
                try { $hash = ([BitConverter]::ToString($sha.ComputeHash($stream))).Replace('-','').ToLowerInvariant() }
                finally { $stream.Dispose() }
                "$hash  ./$normalized"
              }
            } finally { $sha.Dispose() }
          } finally { $zip.Dispose() }
          [IO.File]::WriteAllText((Resolve-Path $manifest), (($out -join "`n") + "`n"), (New-Object Text.UTF8Encoding($false)))
          Get-Content $manifest
      - uses: actions/upload-artifact@v4
        with:
          name: SourceManifest_v1.5.10_runtime_hotfix_canonical
          path: SOURCE_MANIFEST_v1.5.10.sha256
          if-no-files-found: error
