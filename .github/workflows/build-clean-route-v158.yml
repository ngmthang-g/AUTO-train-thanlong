name: Build Clean Route v1.5.9 Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ agent/v159-staging, agent/clean-route-v1.0.0 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-v159:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Reconstruct and verify v1.5.9 sources
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Restore-Transport([string]$Pattern,[string]$OutPath,[string]$ExpectedSha) {
            $parts=Get-ChildItem $Pattern | Sort-Object Name
            if($parts.Count -lt 1){throw "Missing transport $Pattern"}
            $raw=($parts | ForEach-Object {[IO.File]::ReadAllText($_.FullName)}) -join ''
            $b64=[Regex]::Replace($raw,'[^A-Za-z0-9+/=]','')
            $gz=[Convert]::FromBase64String($b64)
            $ms=[IO.MemoryStream]::new($gz)
            $zs=[IO.Compression.GZipStream]::new($ms,[IO.Compression.CompressionMode]::Decompress)
            $out=[IO.File]::Create($OutPath)
            try {$zs.CopyTo($out)} finally {$out.Dispose();$zs.Dispose();$ms.Dispose()}
            $sha=(Get-FileHash -Algorithm SHA256 $OutPath).Hash.ToLowerInvariant()
            Write-Host "$OutPath SHA256=$sha"
            if($sha -ne $ExpectedSha){throw "$OutPath transport mismatch $sha"}
          }
          Restore-Transport 'clean-route/transport-v158/controller.cpp.gz.b64.*' 'clean-route/src/controller.cpp' 'f2a7dc1b5d1a94544011bb56a1f7b8e3df30fc54776fb706ec1c0424c8e00af9'
          Restore-Transport 'clean-route/transport-v158/bridge.cpp.gz.b64.*' 'clean-route/src/bridge.cpp' '64967db0d72cd584c909ce12dd4fdf20cace1128784b9e43214bd419014ed05f'

          # Same compile normalization used by proven v1.5.8 CI.
          $controllerPath='clean-route/src/controller.cpp'
          $controller=[IO.File]::ReadAllText($controllerPath)
          $dup='(?m)^[ \t]+case IDC_ENABLE_CONFIRM:\r?\n[ \t]+if \(HIWORD\(wp\) == BN_CLICKED\) PersistSelectedEditor\(\);\r?\n[ \t]+break;\r?\n(?=[ \t]+case IDC_CONFIRM_INTERVAL:)'
          $matches=[Regex]::Matches($controller,$dup)
          if($matches.Count -ne 1){throw "Expected one v1.5.8 normalization case; got $($matches.Count)"}
          $controller=[Regex]::Replace($controller,$dup,'',1)
          [IO.File]::WriteAllText($controllerPath,$controller,[Text.UTF8Encoding]::new($false))
          $baseSha=(Get-FileHash -Algorithm SHA256 $controllerPath).Hash.ToLowerInvariant()
          if($baseSha -ne '01cafd0a490a140da10db5a92ac23f7b70d794f88cb4936f002f07962dfb0ca0'){throw "v1.5.8 normalized baseline mismatch $baseSha"}

          # Reconstruct exact generated v1.5.9 patch and apply with zero fuzz.
          $patchParts=Get-ChildItem 'clean-route/transport-v159/controller_v158_to_v159.patch.gz.b64.*' | Sort-Object Name
          if($patchParts.Count -lt 1){throw 'Missing v1.5.9 patch transport'}
          $patchB64=(($patchParts | ForEach-Object {[IO.File]::ReadAllText($_.FullName)}) -join '') -replace '[^A-Za-z0-9+/=]',''
          $patchGz=[Convert]::FromBase64String($patchB64)
          $pms=[IO.MemoryStream]::new($patchGz)
          $pzs=[IO.Compression.GZipStream]::new($pms,[IO.Compression.CompressionMode]::Decompress)
          $patchPath=(Join-Path $PWD 'v159_controller.patch')
          $pout=[IO.File]::Create($patchPath)
          try {$pzs.CopyTo($pout)} finally {$pout.Dispose();$pzs.Dispose();$pms.Dispose()}
          $patchSha=(Get-FileHash -Algorithm SHA256 $patchPath).Hash.ToLowerInvariant()
          if($patchSha -ne 'd3ce9108b183e478958593d20eb2a06b65426ede77f486bdf8cea578cd19c75b'){throw "v1.5.9 patch mismatch $patchSha"}
          & git apply --check --whitespace=nowarn --directory=clean-route $patchPath
          if($LASTEXITCODE -ne 0){throw 'v1.5.9 patch --check failed'}
          & git apply --whitespace=nowarn --directory=clean-route $patchPath
          if($LASTEXITCODE -ne 0){throw 'v1.5.9 patch apply failed'}
          $finalSha=(Get-FileHash -Algorithm SHA256 $controllerPath).Hash.ToLowerInvariant()
          Write-Host "v1.5.9 controller SHA256=$finalSha"
          if($finalSha -ne '11739f9d11d056107d6733a34f7d88ae60008a0c9ace2d2eaca97409a4831bbf'){throw 'v1.5.9 controller final mismatch'}

          $expected=@{
            'clean-route/src/rotation_logic.h'='70c04ec1ee9df7c5b6ff9e31c258379916c8704a5cb5ae2062311cdc7747fba4'
            'clean-route/src/rotation_logic_test.cpp'='1ee1ec32ff16d7ddc4c68fd295d909230f07f975440b2d348a8216261042e207'
          }
          foreach($p in $expected.Keys){
            $sha=(Get-FileHash -Algorithm SHA256 $p).Hash.ToLowerInvariant()
            Write-Host "$p SHA256=$sha"
            if($sha -ne $expected[$p]){throw "Source hash mismatch: $p"}
          }
          $controller=[IO.File]::ReadAllText('clean-route/src/controller.cpp')
          foreach($marker in @('SwitchToNextRotationSpot','RecordDeathForRotation','UpdateRotationEfficiency','IDC_ROTATION_LIST','RotationCount','RotateDeathLimit','RotateDeathWindowMin','RotateNoFullBagMin','rotationActiveTrainMs')){
            if(-not $controller.Contains($marker)){throw "Missing v1.5.9 marker $marker"}
          }
          if($controller.Contains('HandleCrossMapConfirm(a, now')){throw 'Semantic Confirm invocation returned'}
          $bridge=[IO.File]::ReadAllText('clean-route/src/bridge.cpp')
          foreach($forbidden in @('ReadSemanticUiPresent','MainFindUI')){
            if($bridge.Contains($forbidden)){throw "Bridge still contains forbidden UI probe $forbidden"}
          }

      - name: Build + audit + self-tests
        shell: pwsh
        working-directory: clean-route
        run: |
          $ErrorActionPreference='Continue'
          & cmd /c build.cmd 2>&1 | Tee-Object -FilePath build-v159.log
          $code=$LASTEXITCODE
          if($code -ne 0){
            $tail=((Get-Content build-v159.log -Tail 180) -join ' | ')
            $tail=$tail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=v1.5.9 build diagnostic::$tail"
            exit $code
          }

      - name: Package v1.5.9
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'clean-route/release-v159' | Out-Null
          $src='clean-route/release-v159/ThanLongCleanRoute_Source_v1.5.9.zip'
          Compress-Archive -Path 'clean-route/src','clean-route/resources','clean-route/docs','clean-route/build.cmd','clean-route/README.md','clean-route/CLEAN_REWRITE_AUDIT.md','clean-route/PROJECT_SUMMARY.md','PROJECT_KNOWLEDGE.md','CHANGELOG.md' -DestinationPath $src -CompressionLevel Optimal
          Copy-Item 'clean-route/dist/ThanLongCleanRoute_v1.5.9.exe' 'clean-route/release-v159/ThanLongCleanRoute_v1.5.9.exe'
          Copy-Item 'clean-route/dist/ThanLongCleanRouteBridge.dll' 'clean-route/release-v159/ThanLongCleanRouteBridge.dll'
          Copy-Item 'clean-route/docs/features/TRAIN_SPOT_ROTATION.md' 'clean-route/release-v159/TRAIN_SPOT_ROTATION.md'
          Copy-Item 'clean-route/docs/history/VERSION_v1.5.9.md' 'clean-route/release-v159/VERSION_v1.5.9.md'
          Copy-Item 'clean-route/docs/decisions/DECISION_013_TRAIN_SPOT_ROTATION.md' 'clean-route/release-v159/DECISION_013_TRAIN_SPOT_ROTATION.md'

      - name: Verify v1.5.9 artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe='clean-route/release-v159/ThanLongCleanRoute_v1.5.9.exe'
          $dll='clean-route/release-v159/ThanLongCleanRouteBridge.dll'
          $src='clean-route/release-v159/ThanLongCleanRoute_Source_v1.5.9.zip'
          foreach($p in @($exe,$dll,$src)){if(!(Test-Path $p)){throw "Missing $p"}}
          $b=[IO.File]::ReadAllBytes($dll)
          if($b[0] -ne 0x4D -or $b[1] -ne 0x5A){throw 'Bridge is not PE/MZ'}
          $pe=[BitConverter]::ToInt32($b,0x3C)
          $ch=[BitConverter]::ToUInt16($b,$pe+22)
          if(($ch -band 0x2000) -eq 0){throw 'Bridge missing DLL characteristic'}
          $h=[System.Runtime.InteropServices.NativeLibrary]::Load((Resolve-Path $dll).Path)
          try {
            $p=[System.Runtime.InteropServices.NativeLibrary]::GetExport($h,'TlcGetMessageHook')
            if($p -eq [IntPtr]::Zero){throw 'Missing TlcGetMessageHook export'}
          } finally { [System.Runtime.InteropServices.NativeLibrary]::Free($h) }
          Write-Host ('EXE SHA256: ' + (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant())
          Write-Host ('DLL SHA256: ' + (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant())
          Write-Host ('SOURCE SHA256: ' + (Get-FileHash -Algorithm SHA256 $src).Hash.ToLowerInvariant())

      - uses: actions/upload-artifact@v4
        with:
          name: ThanLongCleanRoute_v1.5.9_AutoRotateTrainSpots
          path: clean-route/release-v159/*
          if-no-files-found: error
